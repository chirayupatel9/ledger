name: ledger
x-api: &api
  image: ledger-api:local
  build:
    context: .
    target: api
  environment: &api-env
    TZ: Asia/Kolkata
    NODE_ENV: production
    APP_ORIGIN: ${APP_ORIGIN:?Run node deploy/setup.mjs first}
    DATABASE_URL: postgresql://ledger:${POSTGRES_PASSWORD:?Database password required}@db:5432/ledger
    # When set (deploy/setup.mjs generates them), migrate creates this non-superuser role and the API connects as it,
    # so a future SQL-injection bug could not reach superuser-only paths like COPY ... TO PROGRAM. Unset = use ledger.
    LEDGER_APP_USER: ${LEDGER_APP_USER:-}
    LEDGER_APP_PASSWORD: ${LEDGER_APP_PASSWORD:-}
    AUTH_SECRET: ${AUTH_SECRET:?Authentication secret required}
    MAIL_DELIVERY_ENABLED: ${MAIL_DELIVERY_ENABLED:-true}
    SIGNUP_ENABLED: ${SIGNUP_ENABLED:-false}
    SIGNUP_MODE: ${SIGNUP_MODE:-}
    IMPORT_ALERT_EMAIL: ${IMPORT_ALERT_EMAIL:-}
    AMFI_NAV_URL: ${AMFI_NAV_URL:-}
    SMTP_HOST: ${SMTP_HOST:?SMTP host required}
    SMTP_PORT: ${SMTP_PORT:-587}
    SMTP_SECURE: ${SMTP_SECURE:-false}
    SMTP_USER: ${SMTP_USER:-}
    SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    MAIL_FROM: ${MAIL_FROM:?Mail sender required}
    GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  read_only: true
  tmpfs: [/tmp]
services:
  db:
    image: postgres:18-bookworm
    # Everything runs on Indian Standard Time: logs, backup names and database timestamps as displayed.
    command: [postgres, -c, timezone=Asia/Kolkata, -c, log_timezone=Asia/Kolkata]
    environment:
      TZ: Asia/Kolkata
      POSTGRES_DB: ledger
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Database password required}
    volumes: [postgres-data:/var/lib/postgresql]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U ledger -d ledger']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  migrate:
    <<: *api
    command: [node, apps/api/dist/apps/api/src/migrate.js]
    depends_on:
      db: {condition: service_healthy}
    restart: 'no'
  api:
    <<: *api
    # migrate runs the DDL as the superuser (the anchor's DATABASE_URL); the API connects as the app role when
    # configured, falling back to the superuser so an existing deployment without the new secret is unaffected.
    environment:
      <<: *api-env
      DATABASE_URL: postgresql://${LEDGER_APP_USER:-ledger}:${LEDGER_APP_PASSWORD:-$POSTGRES_PASSWORD}@db:5432/ledger
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  web:
    image: ledger-web:local
    build:
      context: .
      target: web
    environment:
      TZ: Asia/Kolkata
      API_INTERNAL_URL: http://api:3001
    depends_on:
      api: {condition: service_healthy}
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp, /app/apps/web/.next/cache]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  proxy:
    image: caddy:2-alpine
    environment:
      TZ: Asia/Kolkata
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      PUBLIC_ORIGIN: ${APP_ORIGIN}
    ports: ['127.0.0.1:5800:80']
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web: {condition: service_healthy}
    restart: unless-stopped
    # NOTE: container hardening (cap_drop/read_only/tmpfs) for this proxy was reverted — it broke Caddy on the
    # production tunnel topology, which CI (plain HTTP) did not exercise. Reintroduce only after testing on the server.
    # See docs/SECURITY-HARDENING.md section 2c.
  backup:
    image: postgres:18-bookworm
    user: '${BACKUP_UID:-1000}:${BACKUP_GID:-1000}'
    entrypoint: [/bin/sh, /usr/local/bin/backup-loop.sh]
    environment:
      TZ: Asia/Kolkata
      PGHOST: db
      PGUSER: ledger
      PGDATABASE: ledger
      PGPASSWORD: ${POSTGRES_PASSWORD:?Database password required}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
    volumes:
      - ./backups:/backups
      - ./deploy/backup-loop.sh:/usr/local/bin/backup-loop.sh:ro
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: [CMD, /bin/sh, /usr/local/bin/backup-loop.sh, check]
      interval: 10m
      timeout: 10s
      start_period: 5m
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
    restart: unless-stopped
  monitor:
    image: ledger-api:local
    command: [node, /monitor/monitor.mjs]
    environment:
      TZ: Asia/Kolkata
      APP_ORIGIN: ${APP_ORIGIN}
      NTFY_URL: ${NTFY_URL:-}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      MONITOR_INTERVAL_MINUTES: ${MONITOR_INTERVAL_MINUTES:-5}
    volumes:
      - ./backups:/backups:ro
      - ./deploy/monitor.mjs:/monitor/monitor.mjs:ro
    depends_on:
      api: {condition: service_healthy}
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    restart: unless-stopped
  mailpit:
    image: axllent/mailpit:v1.27
    profiles: [local]
    ports: ['127.0.0.1:5801:8025']
    restart: unless-stopped
# NOTE: pinning the default network subnet was reverted — applying it to the already-running production network broke
# the deploy, and CI did not reproduce that. Reintroduce only after testing on the server; see
# docs/SECURITY-HARDENING.md section 2a.
volumes:
  postgres-data:
  caddy-data:
  caddy-config:
